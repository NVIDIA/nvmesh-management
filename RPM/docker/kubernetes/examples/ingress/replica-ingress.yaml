# Source: nvmesh-management/templates/ingress.yaml
kind: Ingress
apiVersion: extensions/v1beta1
metadata:
  name: nvmesh-mgmt-ingress
  annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/affinity: cookie
      nginx.ingress.kubernetes.io/affinity-mode: persistent
  labels:

    app.kubernetes.io/version: "2.0.2"
spec:
  tls:
    - hosts:
      - nvmesh-management-0
      - nvmesh-management-1
      - nvmesh-management-2
      secretName: ingress-tls-cert
  rules:
    - host: nvmesh-management-0
      http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-svc-0
              servicePort: ws
    - host: nvmesh-management-1
      http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-svc-1
              servicePort: ws
    - host: nvmesh-management-2
      http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-svc-2
              servicePort: ws
    - host: nvmesh-management-0-0
      http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-svc-0
              servicePort: stats-0
    - host: nvmesh-management-0-1
      http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-svc-0
              servicePort: stats-1
    - host: nvmesh-management-0-2
      http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-svc-0
              servicePort: stats-2
    - host: nvmesh-management-0-3
      http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-svc-0
              servicePort: stats-3
    - host: nvmesh-management-0-4
      http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-svc-0
              servicePort: stats-4
    - host: nvmesh-management-1-0
      http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-svc-1
              servicePort: stats-0
    - host: nvmesh-management-1-1
      http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-svc-1
              servicePort: stats-1
    - host: nvmesh-management-1-2
      http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-svc-1
              servicePort: stats-2
    - host: nvmesh-management-1-3
      http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-svc-1
              servicePort: stats-3
    - host: nvmesh-management-1-4
      http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-svc-1
              servicePort: stats-4
    - host: nvmesh-management-2-0
      http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-svc-2
              servicePort: stats-0
    - host: nvmesh-management-2-1
      http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-svc-2
              servicePort: stats-1
    - host: nvmesh-management-2-2
      http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-svc-2
              servicePort: stats-2
    - host: nvmesh-management-2-3
      http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-svc-2
              servicePort: stats-3
    - host: nvmesh-management-2-4
      http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-svc-2
              servicePort: stats-4
    - http:
        paths:
          - path: /
            backend:
              serviceName: nvmesh-management-gui
              servicePort: gui
status:
  loadBalancer: {}
