apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nvmesh-management
  labels:
    app: nvmesh-management
    {{- include "nvmesh-management.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  serviceName: nvmesh-management-svc-0
  selector:
    matchLabels:
      app: nvmesh-management
  template:
    metadata:
      labels:
        app: nvmesh-management
    spec:
      containers:
        - name: nvmesh-management
          image: "{{ .Values.image.repository }}:{{ .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # This will inject the configuration from the ConfigMap into the container
          - name: CONFIG
            valueFrom:
              configMapKeyRef:
                name: nvmesh-mgmt-config
                key: config
          ports:
            - name: gui
              containerPort: 4000
              protocol: TCP
            - name: ws
              containerPort: 4001
              protocol: TCP
            {{ range $statsPortCount, $portIndex := until (.Values.config.statisticsCores|int) }}
            {{- $port := add 4002 $portIndex -}}
            - name: stats-{{ $portIndex }}
              containerPort: {{ $port }}
              protocol: TCP
            {{ end }}
          {{ if .Values.backupsVolume.deploy -}}
          volumeMounts:
            - name: backups
              mountPath: /var/opt/nvmesh/backups
          {{- end }}
      {{ if and .Values.backupsVolume.deploy .Values.backupsVolume.sharedStorage -}}
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: nvmesh-db-backups
      {{- end }}
  {{ if and .Values.backupsVolume.deploy (not .Values.backupsVolume.sharedStorage) -}}
  volumeClaimTemplates:
    - metadata:
        name: backups
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 5Gi
        selector:
          matchLabels:
            role: nvmesh-backups
  {{- end }}
---
{{ if and .Values.backupsVolume.deploy .Values.backupsVolume.sharedStorage -}}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: nvmesh-db-backups
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  selector:
    matchLabels:
      role: nvmesh-backups
{{- end }}
