<div class="" id="alertBox" data-backdrop="static" data-keyboard="false" tabindex="-1" role="dialog">
    <div class="modal-header">
        <h3 class="modal-title text-center">{{ data.title }}</h3>
    </div>
    <div class="modal-body">
        <br />
        <p>{{ data.text }}</p>
        <br />
    </div>
    <div class="modal-footer">
        <input type="submit" value="OK" class="btn btn-primary" ng-click="ok()">
    </div>
</div>
