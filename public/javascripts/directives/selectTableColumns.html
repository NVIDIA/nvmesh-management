
<span>
	<a class="fa fa-cog column-select-btn"
		ng-class data-toggle="modal" data-target="#columnsModal">
	</a>
	<div class="modal fade pdf-modal" id="columnsModal" role="dialog" data-backdrop="static" data-keyboard="false">
		<div class="modal-dialog ">
			<div class="modal-content">
				<div class="modal-header">
					<a type="button" class="close" ng-click="selectColumnsCtrl.saveSelection()" data-dismiss="modal">&times;</a>
					<h3 class="modal-title text-center">Visible Columns</h3>
				</div>
				<div class="modal-body">
					<span ng-show="selectColumnsCtrl.selected.getValues().length"></span>
					<table multi-select id="columns-table" selected="selectColumnsCtrl.selected" ng-init="selectColumnsCtrl.try = {}"
						single-header-table="true" class="table table-striped table-hover">
						<thead>
							<tr>
								<th>Column Name</th>
							</tr>
						</thead>
						<tbody>
							<tr selectable id="columns-row-{{$index}}" model="column" key="column" ng-repeat="column in selectColumnsCtrl.columnNames |  orderBy : column">
									<td column-name="Target" >{{ ::column }}</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
</span>
