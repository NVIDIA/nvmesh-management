<div class="form-group">
	<div class="progress" id="volumeCapacity">
		<div class="progress-bar progress-bar-info" role="progressbar" style="width:{{ getTrimmedSpaceToAllocate() }}%">
			{{ getSpaceToAllocate() }}% ({{ (volume.capacity - (currentCapacity  || 0)) | gigabytesToBiggestUnits }})
		</div>
		<div class="progress-bar progress-bar-striped progress-bar-mirror" role="progressbar" style="width:{{ getRedundancyUnitTruncatedSpace() }}%" ng-repeat="redundancyUnit in generateRedundancyUnitsIterator() track by $index">
			{{ (volume.RAIDLevel == 'Erasure Coding') ? 'Parity' : 'Mirror' }} #{{ $index + 1 }}
		</div>
		<div class="progress-bar progress-bar-success" role="progressbar" style="width:{{ getRemainingSpace() }}%">
			{{ getRemainingSpace() }}% Free
		</div>
		<div class="progress-bar progress-bar-striped progress-bar-danger" role="progressbar" style="width:{{ getAllocatedSpace() }}%">
			{{ getAllocatedSpace() }}% Used
		</div>
	</div>
</div>
