<div class="multi-select-pager">
	<div class="pull-right" ng-hide="multiSelectClientsCtrl.isDirty">
		<paging-summary
			last-item-index="multiSelectClientsCtrl.lastItemIndex"
			current-page="multiSelectClientsCtrl.currentPage"
			count="multiSelectClientsCtrl.count"
			total="multiSelectClientsCtrl.totalClients">
		</paging-summary>
		<ul id="clientsMultiSelectPagination" class="pagination" items-per-page="[5,10,15]"></ul>
	</div>
	<table multi-select id="clients-multi-select" actions="multiSelectClientsCtrl.actions" is-checked="multiSelectClientsCtrl.isAllSelected" is-dirty="multiSelectClientsCtrl.isDirty"
	selected="multiSelectClientsCtrl.selected" total-items="multiSelectClientsCtrl.totalClients" ng-init="multiSelectClientsCtrl.selected={}" class="table table-striped table-hover table-filtSort">
		<thead>
			<tr>
				<th data-sortable data-filterable data-field="clientID" data-placeholder="Search by Node ID" data-direction="asc">Node ID</th>
				<th class="fixed-size-column md-column" data-sortable data-filterable data-field="configProfile.id" data-placeholder="Search by Config Profile Version">Profile Version</th>
				<th class="fixed-size-column md-column" data-sortable data-filterable data-field="version" data-placeholder="Search by Version">Version</th>
			</tr>
		</thead>
		<tbody>
			<tr selectable id="multi-select-clients-row-{{$index}}" model="client.clientID" key="client.clientID" ng-repeat="client in multiSelectClientsCtrl.clients">
				<td>{{ client.clientID }}</td>
				<td class="fixed-size-column lg-column">{{ client.configProfile | configProfileVersion : 'short' }}</td>
				<td class="fixed-size-column">{{ client.version }}</td>
			</tr>
		</tbody>
	</table>
</div>
