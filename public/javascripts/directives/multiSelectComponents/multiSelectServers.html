<div class="multi-select-pager">
	<div class="pull-right" ng-hide="multiSelectServersCtrl.isDirty">
		<paging-summary
			last-item-index="multiSelectServersCtrl.lastItemIndex"
			current-page="multiSelectServersCtrl.currentPage"
			count="multiSelectServersCtrl.count"
			total="multiSelectServersCtrl.totalServers">
		</paging-summary>
		<ul id="serversMultiSelectPagination" class="pagination">
		</ul>
	</div>
	<table multi-select id="servers-multi-select" actions="multiSelectServersCtrl.actions" is-checked="multiSelectServersCtrl.isAllSelected" is-dirty="multiSelectServersCtrl.isDirty"
	selected="multiSelectServersCtrl.selected" total-items="multiSelectServersCtrl.totalServers" ng-init="multiSelectServersCtrl.selected={}" class="table table-striped table-hover table-filtSort">
		<thead>
			<tr>
				<th data-sortable data-filterable data-field="node_id" data-placeholder="Search by Target ID" data-direction="asc">Target ID</th>
				<th class="fixed-size-column sx-column">Drives</th>
				<th class="fixed-size-column sx-column">NICs</th>
				<th class="fixed-size-column md-column" data-sortable data-filterable data-field="version" data-placeholder="Search by Version">Version</th>
			</tr>
		</thead>
		<tbody>
			<tr selectable id="multi-select-servers-row-{{$index}}" model="server.node_id" key="server.node_id" ng-repeat="server in multiSelectServersCtrl.servers">
				<td><a href ng-href="/servers/server/{{ server.node_id }}/	" ng-click="multiSelectServersCtrl.closeModal()">{{ server.node_id }}</a></td>
				<td class="fixed-size-column">{{ server.disks.length }}</td>
				<td class="fixed-size-column">{{ server.nics.length }}</td>
				<td class="fixed-size-column">{{ server.version }}</td>
			</tr>
		</tbody>
	</table>
</div>
