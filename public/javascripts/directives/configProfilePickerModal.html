<div class="modal fade" id="selectConfigProfileModal"  data-backdrop="static">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">
                &times;</button>
                <h3 class="modal-title text-center">
                    Apply Configuration Profile
                </h3>
            </div>
            <div class="modal-body" style="min-height:1vh;overflow-x:visible;overflow-y:visible;">
                <ng-form name="editNodeConfigurationForm">
                    <label>Select Configuration Profile to apply</label>
                    <select id="selectConfigProfiles"></select>
                    <br /><br />
                    The selected profile will be applied to {{nodeIDs.length}} nodes.
                    <br /><br />
                </ng-form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary mgmt-btn-primary"
                    ng-click="applySelectedProfileToNodes()"
                    title="">Apply</button>

                <button type="button" class="btn btn-default"
                    data-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>
