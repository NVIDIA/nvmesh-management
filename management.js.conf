	connectTimeoutMS: 60000,  // Connection timeout in milliseconds.
	socketTimeoutMS: 60000,   // Socket timeout in milliseconds.
};


//*******************************************************************
// SMTP Options
//*******************************************************************

// Various configuration options specifying which mail server to use for outbound messages.
config.SMTP = {
	host: 'localhost',                // The hostname or IP address of the mail server.
	port: 25,                         // The TCP port to be used on the specified mail server.
	secure: false,                    // Determines where or not SMTP communication is encrypted.
	authRequired: false,              // Determines whether authentication is required for SMTP communication.
	username: '', 					  // If authRequired is true, utilize this username to authenticate to the SMTP server.
	password: '',           		  // If authRequired is true, password to be used for SMTP server account authentication.
	useDefault: true                  // Determines whether to assume gmail SMTP server behavior.
}

// The email address to send "phone home" statistics to.
config.supportEmail = 'customer.stats+customerName@acme.com'

// The email address which will be used for getting a notification upon nvmeshmgr service stop
config.serviceStopNotificationEmail = ''


//*******************************************************************
// Backup Options
//*******************************************************************

// Various configuration options controlling aspects of the automatic backup of the management database.
config.Backup = {
	backupPath : "/var/opt/nvmesh/backups",   // The directory path where backup should be written.
	hourlyBackupInterval: 1,                  // How often the database should be backed up.
	dailyBackupTime: "00:00",                 // Time of the day that should be considered a daily backup.
	hourlyRotationThreshold: 36,              // The number of hourly backups to keep before the oldest is rotated out (deleted).
	dailyRotationThreshold: 30               // The number of daily backups to keep before the oldest is rotated out (deleted).
}

// Determine which ip will be used for management communication in HA
// config.forceIP = '10.0.1.47';

config.enableExecutionTimers = false;

// Max timeout in seconds for clearing pending commits on graceful shutdown
config.clearPendingCommitsMaxTimeout = 30;

// Max memory allocated to the node.js process in MB
// uncomment to increase allocated memory limit, default value when unset is 4096 (MB) = 4GB
// config.nodeAllocatedMemory = 15000; // 15GB

config.openTelemetry = {
    enabled: false,

	// diagLogLevel: Open-Telemetry diagnostics internal logs level
	// options are: 'DEBUG', 'INFO', 'WARNING', 'ERROR'
	diagLogLevel: 'INFO',
	resourceAttributes: {
		// custom attributes that will be added to the resource
		// the following attributes are automatically added: service.name=nvmesh-management, service.namespace=nvmesh, service.version=<version>
		// 'service.namespace': "nvmesh",
        // 'node.cluster': "nvmesh-cluster-1",
        // 'environment': "development"
    },
	autoInstrumentation: {
		enabled: true,
		options: {
			// configure auto instrumentation components

 			// Node.js internals metrics
