// Kafka Connection Options
//*******************************************************************

config.kafkaConnection = {
	hosts: 'localhost:9092',
	enableACL: false,
	transport: {
		TLS: false,						// Determine if TLS should be enable for kafka client connection. (If true, certFile & keyFile options are required)
