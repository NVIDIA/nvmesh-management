var config = {};

//*******************************************************************
// General Options
//*******************************************************************

// IP resolution strategy (required).
// Options:
// 'Manual' - Use forceIP (must be set when using this strategy).
// 'FQDN' - Resolve via system hostname.
// 'FirstInterfaceDefault' - Use default route interface.
// 'SpecificInterface' - Use a named interface (requires specificInterfaceName).
// 'FirstInterface' - Use the first available interface (default). same behavior as older system versions.
config.ipIdentificationStrategy = 'FirstInterface';

// Required if the 'SpecificInterface' strategy is chosen in ipIdentificationStrategy.
// This should be set to the exact name of the network interface to use,
// such as 'eth0' or 'en0'.
// config.specificInterfaceName = 'en0';

// Force an IP address to use for accepting and sending management traffic.
// This option should only be set when the 'Manual' strategy is chosen in ipIdentificationStrategy.
//config.forceIP = '172.0.1.47';

// The TCP port the management server should listen on.
config.port = 4000;

// Determines whether or not HTTP communication to the management server is encrypted via SSL.
config.useSSL = false;

// The TCP port number to be used by management for dynamic updates from clients and targets.
config.webSocketServerPort = 4001;

// Web socket parameters. Do not modify these settings unless you are sure.
config.websocket = {
	auth: {
		useHAWithMTLS: false, // Determines whether or not the communication between management servers in HA is using mutual TLS.
		credentials: {
			email: 'admin@nvidia.com',
			password: 'admin'
		},
		tlsOptions: {
			cert: '/etc/nvmesh/cert/ha/crt.pem', // Path to the file containing the SSL certificate to be used for HTTP encryption.
			key: '/etc/nvmesh/cert/ha/key.pem', // Path to the file containing the key file for the certificate to be used for HTTP encryption.
			ca: '/etc/nvmesh/cert/ca/ca-crt.pem', // Path to the file containing the CA chain.,
			limitToSSLCipherSuites: ''
			// Limit the SSL communication to use a specific list of cipher suites separated by ':' (example: 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384')
		}
	},
	serverConfig: {
		keepalive: true,
		keepaliveInterval: 2000,
		dropConnectionOnKeepaliveTimeout: true,
		keepaliveGracePeriod: 30000,
		closeTimeout: 3000,
		outOfSyncInterval: 5000,
		outOfsyncThreshold: 5000,
		fragmentOutgoingMessages: true,
		maxReceivedMessageSize: Math.pow(1024, 3), // 1 GiB
		maxReceivedFrameSize: Math.pow(1024, 3)   // 1 GiB
	},
	clientConfig: {
		closeTimeout: 3000,
		fragmentOutgoingMessages: true,
		maxReceivedMessageSize: Math.pow(1024, 3), // 1 GiB
		maxReceivedFrameSize: Math.pow(1024, 3) // 1 GiB
	},
	//This settings are for HA keepAlive (ping-pong).
	keepAliveTimeout: 10000,
	keepAliveInterval: 2000
};

// Nodejs HTTP server configuration
config.server = {
	timeout: 1000 * 60 * 100,
	keepAliveTimeout: 1000 * 60 * 10, //10 minutes
	auth: {
		// Determines the authentication method to the management HTTPS server. The options are: credentials or MTLS.
		// credentials - username and password
		// MTLS - a client certificate should be presented with an identifying OU.
		authenticationMethod: 'credentials',

		tlsOptions: {
			cert: '/etc/nvmesh/cert/restServer/server-crt.pem', // Path to the file containing the SSL certificate to be used for HTTP encryption.
			key: '/etc/nvmesh/cert/restServer/server-key.pem', // Path to the file containing the key file for the certificate to be used for HTTP encryption.
			ca: '/etc/nvmesh/cert/restServer/ca-crt.pem', // Path to the file containing the CA chain.
			limitToSSLCipherSuites: '' // Limit the SSL communication to use a specific list of cipher suites separated by ':' (example: 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384')
		}
	}
}

