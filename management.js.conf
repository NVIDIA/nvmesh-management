			// express traces
			'@opentelemetry/instrumentation-express': { enabled: true, ignoreLayersType: ['middleware'] },

			// Kafka traces
			'@opentelemetry/instrumentation-kafka': { enabled: true },

			// MongoDB traces
			'@opentelemetry/instrumentation-mongodb': { enabled: true },

			// Process metrics
			'@opentelemetry/instrumentation-process': { enabled: true },
